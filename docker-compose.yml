# Application Campus France (app + base PostgreSQL).
# Le HTTPS est géré par le proxy Caddy PARTAGÉ (voir deploy/proxy/), afin de
# pouvoir héberger plusieurs applications sur le même serveur.
# Prérequis : le réseau partagé existe -> `docker network create web`

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gcf
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gcf"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: campus_app # nom référencé par le proxy Caddy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gcf
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/gcf
      AUTH_SECRET: ${AUTH_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Accompagnatrice}
      UPLOAD_DIR: /app/uploads
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - internal
      - web # réseau partagé avec le proxy Caddy

networks:
  internal: {}
  web:
    external: true

volumes:
  db_data:
  uploads_data:
